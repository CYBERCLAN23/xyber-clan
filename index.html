  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- Theme + language before first paint (no flash of the wrong theme or language) -->
  <script>
    (function () {
      try {
        var d = document.documentElement;
        var t = localStorage.getItem('xyberclan-theme-v2');
        if (t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches) d.classList.add('dark');
        var l = localStorage.getItem('xyber_lang');
        if (l === 'fr' || l === 'en') d.lang = l;
      } catch (e) {}
    })();
  </script>
